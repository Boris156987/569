
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Una flor🌼</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {

    background:
        radial-gradient(
            circle at 50% 45%,
            #3a2a00 0%,
            #181200 30%,
            #070707 65%,
            #020202 100%
        );

    font-family:
        "Segoe UI",
        Arial,
        sans-serif;

    color: white;
}


/* =====================================================
   CANVAS
===================================================== */

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}

#particles {
    z-index: 1;
}

#flower {
    z-index: 3;
}


/* =====================================================
   LUZ DE FONDO
===================================================== */

.glow {

    position: fixed;

    width: 420px;
    height: 420px;

    left: 50%;
    top: 53%;

    transform: translate(-50%, -50%);

    background: #ffc400;

    opacity: .09;

    filter: blur(100px);

    border-radius: 50%;

    pointer-events: none;

    z-index: 2;

    animation: pulse 4s infinite ease-in-out;
}


@keyframes pulse {

    0%,
    100% {
        transform:
            translate(-50%, -50%)
            scale(.9);
        opacity: .06;
    }

    50% {
        transform:
            translate(-50%, -50%)
            scale(1.1);
        opacity: .12;
    }
}


/* =====================================================
   TEXTO
===================================================== */

.message {

    position: fixed;

    top: 7%;

    width: 100%;

    text-align: center;

    z-index: 10;

    padding: 0 20px;

    animation:
        titleAppear 2s ease forwards;
}


.message h1 {

    font-size:
        clamp(
            2.1rem,
            8vw,
            4.7rem
        );

    letter-spacing: 2px;

    color: #ffe66d;

    text-shadow:

        0 0 8px #ffc400,

        0 0 20px #ffc400,

        0 0 45px rgba(255, 190, 0, .6);
}


.message p {

    margin-top: 12px;

    font-size:
        clamp(
            .9rem,
            3vw,
            1.2rem
        );

    color: #fff7c7;

    opacity: .9;

    line-height: 1.5;

    letter-spacing: .5px;
}


@keyframes titleAppear {

    from {

        opacity: 0;

        transform:
            translateY(-25px);
    }

    to {

        opacity: 1;

        transform:
            translateY(0);
    }
}


/* =====================================================
   BOTÓN
===================================================== */

.button {

    position: fixed;

    bottom: 6%;

    left: 50%;

    transform:
        translateX(-50%);

    z-index: 20;

    padding:
        12px 25px;

    border-radius: 30px;

    border:
        1px solid
        rgba(255, 220, 70, .65);

    background:
        rgba(255, 204, 0, .08);

    backdrop-filter:
        blur(12px);

    color: #ffe66d;

    font-size: 15px;

    cursor: pointer;

    transition:
        .3s ease;

    box-shadow:
        0 0 15px
        rgba(255, 210, 0, .15);
}


.button:hover {

    background:
        rgba(255, 204, 0, .18);

    box-shadow:
        0 0 30px
        rgba(255, 210, 0, .4);

    transform:
        translateX(-50%)
        scale(1.05);
}


/* =====================================================
   MÓVILES
===================================================== */

@media(max-width:600px) {

    .message {
        top: 6%;
    }

    .message h1 {
        letter-spacing: 1px;
    }

    .message p {
        max-width: 320px;
        margin: 10px auto;
    }

    .glow {

        width: 260px;
        height: 260px;
    }

    .button {
        bottom: 5%;
    }
}

</style>
</head>


<body>


<!-- ===================================================
     PARTICULAS
=================================================== -->

<canvas id="particles"></canvas>

<!-- ===================================================
     FLOR
=================================================== -->

<canvas id="flower"></canvas>


<div class="glow"></div>


<!-- ===================================================
     TEXTO
=================================================== -->

<div class="message">

    <h1>
        🌼 🌼
    </h1>

    <p>
        Una pequeña flor amarilla
        dibujada especialmente para alegrarte el día ✨
    </p>

</div>


<button
    class="button"
    onclick="startDrawing()">

    ✨ Dibujar nuevamente

</button>


<script>

/* =====================================================
   CONFIGURACIÓN
===================================================== */

const flowerCanvas =
    document.getElementById("flower");

const ctx =
    flowerCanvas.getContext("2d");

const particleCanvas =
    document.getElementById("particles");

const pctx =
    particleCanvas.getContext("2d");


let W;
let H;

let animationId;


/* =====================================================
   REDIMENSIONAR
===================================================== */

function resize() {

    W =
        flowerCanvas.width =
        window.innerWidth;

    H =
        flowerCanvas.height =
        window.innerHeight;


    particleCanvas.width =
        W;

    particleCanvas.height =
        H;


    startDrawing();
}


window.addEventListener(
    "resize",
    resize
);


/* =====================================================
   UTILIDADES
===================================================== */

function sleep(ms) {

    return new Promise(
        resolve =>
            setTimeout(resolve, ms)
    );
}


function easeOut(t) {

    return 1 -
        Math.pow(
            1 - t,
            3
        );
}


/* =====================================================
   PETALO REALISTA
===================================================== */

function drawPetal({

    x,
    y,

    length,
    width,

    angle,

    color,

    delay = 0,

    bend = 0

}) {

    setTimeout(() => {

        const duration = 650;

        const start =
            performance.now();


        function animate(now) {

            let t =
                (now - start) /
                duration;

            if (t > 1)
                t = 1;


            t = easeOut(t);


            const L =
                length * t;


            const Wd =
                width *
                Math.sin(t * Math.PI);


            ctx.save();


            ctx.translate(
                x,
                y
            );


            ctx.rotate(angle);


            /*
             * Forma del pétalo
             */

            ctx.beginPath();


            /*
             * Base
             */

            ctx.moveTo(
                0,
                0
            );


            /*
             * Lado izquierdo
             */

            ctx.bezierCurveTo(

                -Wd * .45,
                -L * .18,

                -Wd,
                -L * .55,

                0,
                -L

            );


            /*
             * Punta redondeada
             */

            ctx.bezierCurveTo(

                Wd * .45,
                -L * .94,

                Wd * .75,
                -L * .45,

                0,
                0

            );


            ctx.closePath();


            /*
             * Gradiente
             */

            const gradient =
                ctx.createLinearGradient(
                    0,
                    0,
                    0,
                    -L
                );


            gradient.addColorStop(
                0,
                "#d99100"
            );

            gradient.addColorStop(
                .3,
                color
            );

            gradient.addColorStop(
                .72,
                "#ffe15a"
            );

            gradient.addColorStop(
                1,
                "#fff4a8"
            );


            ctx.fillStyle =
                gradient;


            /*
             * Brillo
             */

            ctx.shadowBlur =
                16;

            ctx.shadowColor =
                "#ffc400";


            ctx.fill();


            /*
             * Borde suave
             */

            ctx.strokeStyle =
                "rgba(255,220,70,.3)";

            ctx.lineWidth =
                1;


            ctx.stroke();


            /*
             * Nervadura central
             */

            ctx.beginPath();

            ctx.moveTo(
                0,
                -L * .04
            );


            ctx.quadraticCurveTo(

                bend * Wd,
                -L * .45,

                0,
                -L * .88

            );


            ctx.strokeStyle =
                "rgba(160,105,0,.30)";


            ctx.lineWidth =
                1.3;


            ctx.stroke();


            ctx.restore();


            if (t < 1) {

                requestAnimationFrame(
                    animate
                );

            }

        }


        requestAnimationFrame(
            animate
        );

    }, delay);
}


/* =====================================================
   CENTRO DE LA ROSA
===================================================== */

function drawCenter(
    cx,
    cy
) {

    /*
     * Pequeños pétalos enrollados
     */

    for (
        let i = 0;
        i < 10;
        i++
    ) {

        const angle =
            i *
            Math.PI *
            2 /
            10;


        const radius =
            5 +
            Math.random() * 7;


        const x =
            cx +
            Math.cos(angle) *
            radius;


        const y =
            cy +
            Math.sin(angle) *
            radius *
            .65;


        ctx.save();


        ctx.translate(
            x,
            y
        );


        ctx.rotate(
            angle
        );


        ctx.beginPath();


        ctx.bezierCurveTo(

            -8,
            -5,

            -10,
            5,

            0,
            8

        );


        ctx.bezierCurveTo(

            9,
            4,

            8,
            -4,

            0,
            0

        );


        ctx.fillStyle =
            i % 2 === 0
            ? "#fff09a"
            : "#ffc928";


        ctx.shadowBlur =
            12;


        ctx.shadowColor =
            "#ffc400";


        ctx.fill();


        ctx.restore();
    }


    /*
     * Centro brillante
     */

    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        8,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        "#ffb300";


    ctx.shadowBlur =
        25;


    ctx.shadowColor =
        "#ffb000";


    ctx.fill();
}


/* =====================================================
   ROSA
===================================================== */

async function drawRose() {

    /*
     * Posición adaptativa
     */

    const scale =
        Math.min(
            1,
            W / 700
        );


    const cx =
        W / 2;


    const cy =
        H * .44;


    /*
     * CAPA EXTERIOR
     *
     * Pétalos grandes
     */

    const outer =
        14;


    for (
        let i = 0;
        i < outer;
        i++
    ) {

        const angle =
            (
                Math.PI * 2 /
                outer
            ) * i
            -
            Math.PI / 2;


        const radius =
            28 * scale;


        drawPetal({

            x:
                cx +
                Math.cos(angle) *
                radius,

            y:
                cy +
                Math.sin(angle) *
                radius *
                .65,

            length:
                125 * scale,

            width:
                65 * scale,

            angle:
                angle +
                Math.PI / 2,

            color:
                "#ffd52e",

            delay:
                i * 70,

            bend:
                .15
        });
    }


    /*
     * SEGUNDA CAPA
     */

    const second =
        12;


    for (
        let i = 0;
        i < second;
        i++
    ) {

        const angle =
            (
                Math.PI * 2 /
                second
            ) * i
            +
            Math.PI / 12;


        drawPetal({

            x:
                cx +
                Math.cos(angle) *
                23 *
                scale,

            y:
                cy +
                Math.sin(angle) *
                23 *
                scale *
                .65,

            length:
                105 * scale,

            width:
                57 * scale,

            angle:
                angle +
                Math.PI / 2,

            color:
                "#ffc91c",

            delay:
                1000 +
                i * 75,

            bend:
                -.12
        });
    }


    /*
     * TERCERA CAPA
     */

    const third =
        10;


    for (
        let i = 0;
        i < third;
        i++
    ) {

        const angle =
            (
                Math.PI * 2 /
                third
            ) * i
            +
            Math.PI / 10;


        drawPetal({

            x:
                cx +
                Math.cos(angle) *
                15 *
                scale,

            y:
                cy +
                Math.sin(angle) *
                15 *
                scale *
                .6,

            length:
                82 * scale,

            width:
                48 * scale,

            angle:
                angle +
                Math.PI / 2,

            color:
                "#ffe04c",

            delay:
                1900 +
                i * 80,

            bend:
                .18
        });
    }


    /*
     * CUARTA CAPA
     */

    const inner =
        8;


    for (
        let i = 0;
        i < inner;
        i++
    ) {

        const angle =
            (
                Math.PI * 2 /
                inner
            ) * i;


        drawPetal({

            x:
                cx +
                Math.cos(angle) *
                7 *
                scale,

            y:
                cy +
                Math.sin(angle) *
                7 *
                scale,

            length:
                58 * scale,

            width:
                38 * scale,

            angle:
                angle +
                Math.PI / 2,

            color:
                "#fff080",

            delay:
                2700 +
                i * 90,

            bend:
                -.2
        });
    }


    /*
     * Centro
     */

    setTimeout(
        () =>
            drawCenter(
                cx,
                cy
            ),
        3600
    );
}


/* =====================================================
   TALLO
===================================================== */

function drawStem() {

    const startX =
        W / 2;

    const startY =
        H * .84;


    const endX =
        W / 2;

    const endY =
        H * .47;


    let progress =
        0;


    function animate() {

        progress +=
            .018;


        if (progress > 1)
            progress = 1;


        const x =
            startX +
            (
                endX -
                startX
            ) *
            progress;


        const y =
            startY +
            (
                endY -
                startY
            ) *
            progress;


        ctx.beginPath();


        ctx.moveTo(
            startX,
            startY
        );


        ctx.bezierCurveTo(

            W / 2 - 25,
            H * .72,

            W / 2 + 20,
            H * .58,

            x,
            y

        );


        ctx.strokeStyle =
            "#4c9c36";


        ctx.lineWidth =
            Math.max(
                4,
                7 * Math.min(
                    1,
                    W / 500
                )
            );


        ctx.lineCap =
            "round";


        ctx.shadowBlur =
            10;


        ctx.shadowColor =
            "#58b83c";


        ctx.stroke();


        if (
            progress <
            1
        ) {

            requestAnimationFrame(
                animate
            );

        }
    }


    animate();
}


/* =====================================================
   HOJAS
===================================================== */

function drawLeaf(
    x,
    y,
    angle,
    size,
    delay
) {

    setTimeout(() => {

        ctx.save();


        ctx.translate(
            x,
            y
        );


        ctx.rotate(
            angle
        );


        ctx.beginPath();


        ctx.moveTo(
            0,
            0
        );


        ctx.bezierCurveTo(

            size * .35,
            -size * .9,

            size * 1.1,
            -size * .8,

            size * 1.5,
            0

        );


        ctx.bezierCurveTo(

            size * 1.0,
            size * .45,

            size * .35,
            size * .4,

            0,
            0

        );


        ctx.closePath();


        const gradient =
            ctx.createLinearGradient(
                0,
                0,
                size,
                0
            );


        gradient.addColorStop(
            0,
            "#286d2c"
        );

        gradient.addColorStop(
            1,
            "#68b941"
        );


        ctx.fillStyle =
            gradient;


        ctx.shadowBlur =
            10;


        ctx.shadowColor =
            "#4da839";


        ctx.fill();


        /*
         * Nervadura
         */

        ctx.beginPath();


        ctx.moveTo(
            0,
            0
        );


        ctx.lineTo(
            size * 1.25,
            0
        );


        ctx.strokeStyle =
            "rgba(180,240,120,.4)";


        ctx.lineWidth =
            1;


        ctx.stroke();


        ctx.restore();

    }, delay);
}


/* =====================================================
   PARTICULAS
===================================================== */

let particles = [];


class Particle {

    constructor() {

        this.reset();

        this.y =
            Math.random() *
            H;
    }


    reset() {

        this.x =
            Math.random() *
            W;


        this.y =
            H + 10;


        this.size =
            Math.random() *
            2.2 +
            .5;


        this.speed =
            Math.random() *
            .55 +
            .2;


        this.opacity =
            Math.random() *
            .7 +
            .15;


        this.angle =
            Math.random() *
            Math.PI *
            2;


        this.swing =
            Math.random() *
            .025;
    }


    update() {

        this.y -=
            this.speed;


        this.angle +=
            this.swing;


        this.x +=
            Math.sin(
                this.angle
            ) *
            .25;


        if (
            this.y <
            -10
        ) {

            this.reset();
        }
    }


    draw() {

        pctx.beginPath();


        pctx.arc(

            this.x,
            this.y,
            this.size,

            0,
            Math.PI * 2

        );


        pctx.fillStyle =
            `rgba(
                255,
                220,
                80,
                ${this.opacity}
            )`;


        pctx.shadowBlur =
            10;


        pctx.shadowColor =
            "#ffd000";


        pctx.fill();
    }
}


/* Crear partículas */

for (
    let i = 0;
    i < 100;
    i++
) {

    particles.push(
        new Particle()
    );
}


/* Animación */

function animateParticles() {

    pctx.clearRect(
        0,
        0,
        W,
        H
    );


    particles.forEach(
        particle => {

            particle.update();

            particle.draw();

        }
    );


    requestAnimationFrame(
        animateParticles
    );
}


animateParticles();


/* =====================================================
   PARTICULAS AL TOCAR
===================================================== */

window.addEventListener(
    "pointermove",
    event => {

        if (
            Math.random() > .35
        )
            return;


        particles.push({

            x:
                event.clientX +
                (
                    Math.random() -
                    .5
                ) * 20,

            y:
                event.clientY +
                (
                    Math.random() -
                    .5
                ) * 20,

            size:
                Math.random() *
                2 +
                1,

            speed:
                .6,

            opacity:
                .8,

            angle:
                0,

            swing:
                0,

            update() {

                this.y -=
                    this.speed;

                this.opacity -=
                    .015;

            },

            draw() {

                pctx.beginPath();


                pctx.arc(

                    this.x,
                    this.y,
                    this.size,

                    0,
                    Math.PI * 2

                );


                pctx.fillStyle =
                    `rgba(
                        255,
                        220,
                        80,
                        ${this.opacity}
                    )`;


                pctx.fill();
            }

        });


        if (
            particles.length >
            160
        ) {

            particles.splice(
                0,
                10
            );
        }

    }
);


/* =====================================================
   INICIAR TODO
===================================================== */

function startDrawing() {

    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    /*
     * Tallo primero
     */

    drawStem();


    /*
     * Hojas
     */

    drawLeaf(
        W / 2 - 7,
        H * .69,
        -0.65,
        42,
        700
    );


    drawLeaf(
        W / 2 + 2,
        H * .64,
        0.65,
        38,
        1000
    );


    /*
     * Rosa al final
     */

    setTimeout(
        () => {
            drawRose();
        },
        1000
    );
}


/* =====================================================
   ARRANQUE
===================================================== */

resize();

</script>

</body>
</html>
